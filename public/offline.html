<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trivia Showdown Offline</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #070812;
        color: #f5f7fb;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(460px, 100%);
        text-align: center;
      }

      h1 {
        margin: 0 0 12px;
        color: #00e5ff;
        font-size: 28px;
      }

      p {
        margin: 0 0 18px;
        color: #b3c1d6;
        line-height: 1.5;
      }

      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 8px;
        padding: 0 16px;
        background: #202837;
        color: #f5f7fb;
        font-weight: 900;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Trivia Showdown</h1>
      <p>Trivia Showdown needs an internet connection for live games. Reconnect to continue.</p>
      <a href="/">Try Again</a>
    </main>
  </body>
</html>
